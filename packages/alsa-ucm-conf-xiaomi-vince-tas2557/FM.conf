# Receive-only FM audio for Xiaomi Redmi 5 Plus (vince).
# RF power, tuning and seek are owned by a native V4L2 application.
# MultiMedia2 is exclusive with HiFi/Mic2: select one UCM verb at a time.
# Playback device sections below are copied unchanged from accepted HiFi.

SectionVerb {
	EnableSequence [
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='MultiMedia2 Mixer INTERNAL_FM_TX' 1"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer INTERNAL_FM_TX' 0"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
		Priority 10
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Headphones"
	]

	Include.ees.File "/codecs/msm8953-wcd/EarpieceEnableSeq.conf"
	Include.eds.File "/codecs/msm8953-wcd/EarpieceDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 1
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Earpiece"
	]

	Include.hpes.File "/codecs/msm8953-wcd/HeadphonesEnableSeq.conf"
	Include.hpds.File "/codecs/msm8953-wcd/HeadphonesDisableSeq.conf"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback (TAS2557)"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 2
	}
}

SectionDevice."FM" {
	Comment "FM radio capture (wired headphones required as antenna)"
	EnableSequence [
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='MultiMedia2 Mixer INTERNAL_FM_TX' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer INTERNAL_FM_TX' 0"
	]
	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
		CaptureRate 48000
		CapturePriority 100
	}
}
